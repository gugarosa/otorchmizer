[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otorchmizer"
version = "3.0.0"
description = "A PyTorch-based library for nature-inspired meta-heuristic optimization"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Gustavo Rosa", email = "gustavo.rosa@unesp.br"},
]
keywords = ["optimization", "meta-heuristic", "pytorch", "gpu", "nature-inspired"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.0.0",
    "matplotlib>=3.5.0",
    "numpy>=1.23",
    "tqdm>=4.60.0",
    "dill>=0.3.6",
]

[project.urls]
Homepage = "https://github.com/gugarosa/otorchmizer"
Documentation = "https://otorchmizer.readthedocs.io"
Repository = "https://github.com/gugarosa/otorchmizer"
"Bug Tracker" = "https://github.com/gugarosa/otorchmizer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit>=3.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.setuptools.packages.find]
include = ["otorchmizer*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["otorchmizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests that require a GPU",
    "multigpu: marks tests that require multiple GPUs",
]
