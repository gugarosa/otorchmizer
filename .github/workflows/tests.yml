name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      - run: uv pip install --torch-backend cpu -e ".[dev]"
      - run: uv run --no-sync pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install --torch-backend cpu -e ".[dev,docs]"
      - run: uv run --no-sync pre-commit run --all-files
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv run --no-sync sphinx-build -W --keep-going -b doctest docs docs/_build/doctest
      - run: uv build
      - run: uv pip install --no-deps --reinstall dist/*.whl
      - run: uv run --no-sync python -I -m pytest --import-mode=importlib -q tests/otorchmizer
